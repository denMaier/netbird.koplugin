name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open with the next version and changelog (it also
  # bumps the version in _meta.lua); merging it creates the tag and a draft
  # release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0

      - name: Verify version matches tag
        run: |
          META_VER=$(sed -n 's/.*version = "\(.*\)".*/\1/p' _meta.lua)
          if [ "v${META_VER}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match _meta.lua version ${META_VER}"
            exit 1
          fi
          # The store files are committed to main below, so the tag must be on it.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${TAG} is not on main"
            exit 1
          fi

      # git archive puts the commit in the zip, so its digest can only be known
      # once the tag exists. It also stamps file times in local time: pin it.
      - name: Build zip
        run: TZ=UTC git archive --prefix=netbird.koplugin/ -o "netbird.koplugin-${TAG}.zip" HEAD

      # release-please made a draft release; attach the zip, then publish it.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG}" "netbird.koplugin-${TAG}.zip"
          gh release edit "${TAG}" --draft=false --latest

      # ZenPM installs what manifest.json and versions.json name. They describe the
      # asset just uploaded, so they are written from it and only after it exists.
      - name: Publish to ZenPM
        run: |
          zip="netbird.koplugin-${TAG}.zip"
          mv "$zip" "${RUNNER_TEMP}/"
          git checkout main
          python3 - "${RUNNER_TEMP}/$zip" <<'EOF'
          import hashlib, json, os, sys, time
          path = sys.argv[1]
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          name = os.path.basename(path)
          size = os.path.getsize(path)
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()

          with open("versions.json") as f:
              versions = json.load(f)
          releases = [r for r in versions["releases"] if r["tag_name"] != tag]
          releases.insert(0, {"tag_name": tag, "name": tag, "assets": [{
              "name": name,
              "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              "size": size,
              "digest": f"sha256:{digest}",
          }]})
          versions["releases"] = releases
          with open("versions.json", "w") as f:
              json.dump(versions, f, indent=2, ensure_ascii=False)
              f.write("\n")

          with open("manifest.json") as f:
              manifest = json.load(f)
          package = manifest["packages"][0]
          package.update(version=tag.removeprefix("v"), source_asset=name, size=str(size),
                         published_at=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()))
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json
          git commit -m "chore: publish ${TAG} to ZenPM"
          git push origin main
