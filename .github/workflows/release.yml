name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version matches tag
        run: |
          META_VER=$(sed -n 's/.*version = "\(.*\)".*/\1/p' _meta.lua)
          if [ "v${META_VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match _meta.lua version ${META_VER}"
            exit 1
          fi
          # The store files are committed to main below, so the tag must be on it.
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main"
            exit 1
          fi

      # git archive puts the commit in the zip, so its digest can only be known
      # once the tag exists. It also stamps file times in local time: pin it.
      - name: Build zip
        run: TZ=UTC git archive --prefix=netbird.koplugin/ -o "netbird.koplugin-${GITHUB_REF_NAME}.zip" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "netbird.koplugin-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      # ZenPM installs what manifest.json and versions.json name. They describe the
      # asset just uploaded, so they are written from it and only after it exists.
      - name: Publish to ZenPM
        run: |
          zip="netbird.koplugin-${GITHUB_REF_NAME}.zip"
          mv "$zip" "${RUNNER_TEMP}/"
          git checkout main
          python3 - "${RUNNER_TEMP}/$zip" <<'EOF'
          import hashlib, json, os, sys, time
          path = sys.argv[1]
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          name = os.path.basename(path)
          size = os.path.getsize(path)
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()

          with open("versions.json") as f:
              versions = json.load(f)
          releases = [r for r in versions["releases"] if r["tag_name"] != tag]
          releases.insert(0, {"tag_name": tag, "name": tag, "assets": [{
              "name": name,
              "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              "size": size,
              "digest": f"sha256:{digest}",
          }]})
          versions["releases"] = releases
          with open("versions.json", "w") as f:
              json.dump(versions, f, indent=2, ensure_ascii=False)
              f.write("\n")

          with open("manifest.json") as f:
              manifest = json.load(f)
          package = manifest["packages"][0]
          package.update(version=tag.removeprefix("v"), source_asset=name, size=str(size),
                         published_at=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()))
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json
          git commit -m "Publish ${GITHUB_REF_NAME} to ZenPM"
          git push origin main
