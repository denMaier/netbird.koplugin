version: 2
updates:
  # CI-only changes ship nothing, so "ci(deps)" makes no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week's minor and patch updates come as one PR (and at most one
    # release); major updates stay separate and wait for review.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
